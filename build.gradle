import java.text.SimpleDateFormat

static def getTimestampVersion() {
    def date = new Date()
    def format = new SimpleDateFormat("yy.MM.dd-HH.mm")

    format.setTimeZone(TimeZone.getTimeZone("GMT+10:00"))
    return format.format(date)
}

plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = getTimestampVersion()
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "originscontent" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file("src/main/resources/originscontent.classtweaker")
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        url = 'https://maven.cafeteria.dev'
        content {
            includeGroup 'net.adriantodt.fabricmc'
        }
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        url "https://jitpack.io"
    }
    maven {
        url "https://maven.shedaniel.me/"
    }
    maven {
        url "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://mvn.devos.one/snapshots/"
    }
    maven {
        url "https://mvn.devos.one/releases/"
    }
    maven {
        url "https://maven.createmod.net"
    }
    maven {
        url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
    }
    maven {
        url 'https://masa.dy.fi/maven'
    }
    maven {
        url "https://repo.greenhouse.house/releases/"
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town"
    }

    maven {
        url = "https://maven.bawnorton.com/releases"
        content {
            includeGroup("com.github.bawnorton.mixinsquared")
        }
    }

    maven {
        url = "https://maven.blamejared.com"
    }

    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    
    mavenLocal()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.118") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.github.apace100:origins-fabric:${project.origins_version}"
    modImplementation "com.github.apace100:apoli:${project.apoli_version}"
    modImplementation "maven.modrinth:DfvI9QGt:lxt2QwZh" // Defile
    modImplementation "maven.modrinth:SQhWMwht:otYYNz4L" // Arsenal
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-world:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cca_version}"
    modImplementation("net.merchantpug:Apugli:${project.apugli_version}-fabric") {
        exclude(module: "apoli")
    }
    //modImplementation "maven.modrinth:aUR0Fu8o:Ob58jOS3" // Origins: Math
    modImplementation "maven.modrinth:oTXs6boa:Clmgxurq" // Faithful Mace
    modImplementation "org.ladysnake:pick-your-poison:1.1.1"
    modImplementation "maven.modrinth:additionalentityattributes:1.7.6+1.20.1"
    modImplementation "maven.modrinth:rVUtrHuM:zXYXrqoK" // Backported Spears
    modCompileOnly "dev.emi:emi-fabric:1.1.24+1.20.1"
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7")))
    modImplementation "maven.modrinth:sync:1.11.8"
    modImplementation "maven.modrinth:jade:11.13.3+fabric"
    modImplementation "maven.modrinth:iris:1.7.6+1.20.1"
    modImplementation "xaero.map:xaeroworldmap-fabric-1.20.1:1.44.2"
    modImplementation "xaero.minimap:xaerominimap-fabric-1.20.1:26.4.2"
    modImplementation include("team.lodestar.lodestone:lodestone:1.20.1-1.6.2.3f-fabric")

    modImplementation include("dev.zac99lol:neverend:1.0.0") // we don't talk about this one.
    modImplementation include("net.ludocrypt:specialmodels:1.4.10")
}

processResources {

    inputs.property "version", getTimestampVersion()
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": getTimestampVersion(),
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }

    manifest {
        attributes(
                "Main-Class": "dev.zac99lol.originscontent.JarLauncher"
        )
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module("com.terraformersmc:modmenu:7.1.0") using module("maven.modrinth:modmenu:7.1.0")
        substitute module("com.terraformersmc:modmenu:6.2.1") using module("maven.modrinth:modmenu:6.2.1")
    }
}